<!-- Supabase auth email template (en). Paste into Supabase → Authentication → Emails → Templates,
     for BOTH "Magic link" and "Confirm signup". The link must point at /auth/confirm with token_hash. -->
<div style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;max-width:480px;margin:0 auto;padding:24px;color:#111827">
  <h2 style="margin:0 0 16px">Your login link</h2>
  <p style="margin:0 0 24px;line-height:1.5">Click the button below to log in. The link works once and expires in 1 hour.</p>
  <p style="margin:0 0 24px">
    <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email"
       style="display:inline-block;background:#111827;color:#ffffff;padding:12px 20px;border-radius:8px;text-decoration:none;font-weight:600">Log in</a>
  </p>
  <p style="margin:0 0 8px;line-height:1.5">Or enter this code on the login page:</p>
  <p style="margin:0 0 24px;font-size:24px;font-weight:700;letter-spacing:4px">{{ .Token }}</p>
  <p style="margin:0;color:#6b7280;font-size:13px">If you didn't ask for this email, you can safely ignore it.</p>
</div>
